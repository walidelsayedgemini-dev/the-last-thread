    <style>
      /* First paint: a quiet case-file dark before the 2D interface loads. */
      html, body { margin: 0; background: #070d12; color: #e9e4d9; }
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font: 700 2.4rem/1 sans-serif; color: #ef7078; letter-spacing: 0.04em; }
      #splash img { width: 84px; height: 84px; }
      #splash .bar { width: min(260px, 60vw); height: 3px; background: #1c3038; overflow: hidden; }
      #splash .bar i { display: block; height: 100%; width: 35%; background: #65cbd0; animation: splash-run 1.2s ease-in-out infinite; }
      @keyframes splash-run { from { transform: translateX(120%); } to { transform: translateX(-300%); } }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="splash" role="status" aria-label="جارٍ التحميل"><img src="./favicon.svg" alt="" /><span>الخيط الأخير</span><div class="bar"><i></i></div></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if (typeof window.Capacitor === 'undefined' && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', () => navigator.serviceWorker?.register('./sw.js').catch(() => undefined), { once: true })
      }
    </script>
  </body>
